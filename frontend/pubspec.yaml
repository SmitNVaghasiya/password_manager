name: passmgr
description: "Local-only encrypted password manager for Android."
publish_to: 'none'

version: 1.2.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.3
  path: ^1.9.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.1
  file_picker: ^12.0.0-beta.4
  csv: ^8.0.0
  secure_application: ^4.1.0
  path_provider: ^2.1.3
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
